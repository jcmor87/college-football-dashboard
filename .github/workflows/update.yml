name: Update dashboard data

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch && github.ref_type == 'branch'
    permissions:
      contents: write
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Refresh ESPN snapshot
        run: python update_data.py
      - name: Commit updated snapshot
        run: |
          git add -- data/dashboard.json
          if git diff --cached --quiet; then
            echo "Dashboard data is already current."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh college football dashboard data'
          git push origin "HEAD:${GITHUB_REF}"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Stage dashboard files
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/dashboard.json _site/data/dashboard.json
      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: update
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
