name: Update dashboard data

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
  pull_request:

permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests
      - run: node --test tests/*.test.mjs
      - name: Verify forecast archive against PR base
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: python verify_release.py --baseline "$PR_BASE"
      - name: Regenerate power data without publishing
        run: python update_power.py --output "$RUNNER_TEMP/power-rankings"
      - name: Regenerate prediction preview without archiving
        run: python update_predictions.py --output "$RUNNER_TEMP/predictions"
      - name: Precompute simulator preview without publishing
        run: node update_simulation.mjs "$RUNNER_TEMP/playoff-simulation.json"
      - name: Install Chromium for browser tests
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test profiles in Chromium
        run: node tests/profile-browser.cjs
      - name: Upload review screenshot
        uses: actions/upload-artifact@v4
        with:
          name: team-profile-preview
          path: team-profile-preview.png

  update:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch && github.ref_type == 'branch'
    permissions:
      contents: write
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh ESPN snapshot
        run: python update_data.py
      - name: Archive weekly AP rankings
        run: python update_rankings.py
      - name: Generate FBS team profiles
        run: python update_profiles.py
      - name: Generate power rankings and backtest
        run: python update_power.py
      - name: Generate predictions and archive pregame revisions
        run: python update_predictions.py --archive-live
      - name: Refresh conference title fixtures
        run: python update_playoff.py
      - name: Precompute playoff simulation baselines
        run: node update_simulation.mjs
      - name: Refresh Notre Dame news
        continue-on-error: true
        run: python update_news.py
      - name: Refresh Notre Dame roster and depth chart
        continue-on-error: true
        run: |
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get install -y poppler-utils || echo "PDF extraction unavailable. The roster can still refresh."
          fi
          python update_roster.py
      - name: Verify pregame records and data consistency
        run: python verify_release.py --write-manifest
      - name: Commit updated data
        run: |
          git add -- data/dashboard.json data/ap-rankings data/team-profiles.json data/power-rankings data/predictions data/refresh-status.json data/cfp-title-games.json data/playoff-simulation.json data/notre-dame-news.json data/notre-dame-roster.json
          if git diff --cached --quiet; then
            echo "Dashboard data is already current."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh college football dashboard data'
          git push origin "HEAD:${GITHUB_REF}"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Stage dashboard files
        run: |
          mkdir -p _site/data
          cp index.html featured-games.mjs ranking-history.mjs team-profiles.mjs nd-command.mjs notre-dame-news.mjs notre-dame-roster.mjs power-rankings.mjs game-predictions.mjs playoff-model.mjs playoff-explorer.mjs playoff-simulation.mjs playoff-simulator-ui.mjs playoff-worker.mjs _site/
          cp data/dashboard.json data/team-profiles.json data/refresh-status.json data/cfp-title-games.json data/cfp-official-bracket.json data/playoff-simulation.json data/notre-dame-news.json data/notre-dame-roster.json _site/data/
          cp -R data/ap-rankings data/power-rankings data/predictions _site/data/
      - name: Verify staged Pages files
        run: python verify_release.py --staged _site
      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: update
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
